# UI nginx: serves the static frontend on / and proxies /api to the API stack.
#
# The proxy target is the API project's nginx container, reached over the
# shared Docker network ("products_products-network", created by the API
# compose project). The upstream name is resolved lazily through Docker's
# embedded DNS so this server starts even when the API stack is not running;
# in that case the UI shows its error state with a retry button.
#
# The API nginx terminates TLS with a self-signed certificate, hence
# proxy_ssl_server_name on (send SNI) and proxy_ssl_verify off.
# These TLS settings are for LOCAL DEVELOPMENT ONLY.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver, used for lazy upstream resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Static frontend.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy. The path is passed through unchanged, so the browser
    # sees a single origin and CORS is not needed.
    location /api/ {
        set $api_upstream products-api-nginx;

        proxy_pass https://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Self-signed cert on the API nginx -> do not verify, but do send SNI.
        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        # Give a clean 502 to the UI when the upstream is unreachable; the UI
        # turns any non-2xx into a friendly error state with retry.
        proxy_intercept_errors on;
    }
}
